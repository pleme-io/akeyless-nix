[package]
name = "akeyless-install-secrets"
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
description = "Fetch Akeyless secrets at Nix activation time — drop-in sops-nix replacement"
license = "MIT"
authors = ["Pleme Team <team@pleme.io>"]
repository = "https://github.com/pleme-io/akeyless-nix"
homepage = "https://github.com/pleme-io/akeyless-nix"
keywords = ["akeyless", "nix", "secrets", "home-manager"]
categories = ["development-tools", "command-line-utilities"]
exclude = ["module/", "target/", "result-*", "Cargo.nix", "flake.nix", "flake.lock"]

[[bin]]
name = "akeyless-install-secrets"
path = "src/main.rs"

[dependencies]
# Credential files created at their final mode by open(2) rather than
# chmod'ed after the fact — closes the interval in which an activation-time
# secret is readable by anyone but its owner.
cofre-fs = { git = "https://github.com/pleme-io/cofre" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
akeyless-api = { git = "https://github.com/pleme-io/akeyless-api", features = ["rustls-tls"] }
igata = { git = "https://github.com/pleme-io/igata" }
shikumi = { git = "https://github.com/pleme-io/shikumi" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
shellexpand = "3.1"
libc = "0.2"
sha2 = "0.10"

[lints.clippy]
pedantic = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
