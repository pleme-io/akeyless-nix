[package]
name = "akeyless-install-secrets"
version = "0.1.2"
edition = "2024"
rust-version = "1.89.0"
description = "Fetch Akeyless secrets at Nix activation time — drop-in sops-nix replacement"
license = "MIT"
authors = ["Pleme Team <team@pleme.io>"]
repository = "https://github.com/pleme-io/akeyless-nix"
homepage = "https://github.com/pleme-io/akeyless-nix"
keywords = ["akeyless", "nix", "secrets", "home-manager"]
categories = ["development-tools", "command-line-utilities"]
exclude = ["module/", "target/", "result-*", "Cargo.nix", "flake.nix", "flake.lock"]

[[bin]]
name = "akeyless-install-secrets"
path = "src/main.rs"

[dependencies]
# Credential files created at their final mode by open(2) rather than
# chmod'ed after the fact — closes the interval in which an activation-time
# secret is readable by anyone but its owner.
cofre-fs = "0.1.4"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
akeyless-api = { version = "0.1.1", features = ["rustls-tls"] }
# ★ DO NOT "FIX" THIS BY POINTING IT AT crates.io. Measured 2026-08-07.
#
# `pleme-igata` IS on the registry now (0.1.5) and it is NOT this crate. The
# rev pinned below is the `igata` TEMPLATE ENGINE — `[lib] name = "igata"`,
# with `traits::TemplateRenderer` and `MiniJinjaRenderer`, which is what
# src/template.rs imports. Commit 7477921 ("rewrite igata as Nix-first
# Packer-compatible machine image builder", 2026-03-27) REPLACED that crate
# wholesale in the same repo: renamed the package to `pleme-igata`, deleted
# src/lib.rs, and shipped an unrelated machine-image builder.
#
# So the repo name is continuous and the CRATE is not. Flipping to
# `{ package = "pleme-igata", version = "0.1.5" }` compiles to:
#
#   error[E0433]: failed to resolve: use of unresolved module or unlinked
#                 crate `igata`     (×5)
#
# because the published crate is binary-only — no `src/lib.rs`, no lib target,
# nothing to import.
#
# ALSO NOTE WHAT DID NOT CATCH IT: `cargo package --no-verify` SUCCEEDED on the
# flipped manifest — 26 files, 80.9KiB — because it never compiles anything.
# Packaging cleanly is not evidence the code builds.
#
# The real fix is upstream and is a DECISION, not a dep bump: either the
# template engine gets its own crate/repo again, or this consumer moves to a
# different renderer. Until then the rev pin is load-bearing — it is the only
# remaining coordinate for a crate that no longer exists at its repo's HEAD.
igata = { git = "https://github.com/pleme-io/igata" }
shikumi = "0.1.496"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
shellexpand = "3.1"
libc = "0.2"
sha2 = "0.10"

[lints.clippy]
pedantic = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
