[package]
name = "akeyless-install-secrets"
version = "0.1.3"
edition = "2024"
rust-version = "1.89.0"
description = "Fetch Akeyless secrets at Nix activation time — drop-in sops-nix replacement"
license = "MIT"
authors = ["Pleme Team <team@pleme.io>"]
repository = "https://github.com/pleme-io/akeyless-nix"
homepage = "https://github.com/pleme-io/akeyless-nix"
keywords = ["akeyless", "nix", "secrets", "home-manager"]
categories = ["development-tools", "command-line-utilities"]
exclude = ["module/", "target/", "result-*", "Cargo.nix", "flake.nix", "flake.lock"]

[[bin]]
name = "akeyless-install-secrets"
path = "src/main.rs"

[dependencies]
# Credential files created at their final mode by open(2) rather than
# chmod'ed after the fact — closes the interval in which an activation-time
# secret is readable by anyone but its owner.
cofre-fs = "0.1.4"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
akeyless-api = { version = "0.1.1", features = ["rustls-tls"] }
# Template rendering. This used to be a bare `git =` dep on pleme-io/igata,
# whose crate was deleted upstream by commit 7477921 (the repo now ships an
# unrelated machine-image builder as `pleme-igata`), leaving a rev pin as the
# only coordinate for a crate that no longer exists at its repo's HEAD. A dep
# with no version requirement is structurally unpublishable, so it blocked this
# repo from releasing. The ~120-line surface came home to src/template_engine.rs
# and now sits directly on minijinja from the registry.
minijinja = { version = "2", features = ["custom_syntax"] }
shikumi = "0.1.496"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
shellexpand = "3.1"
libc = "0.2"
sha2 = "0.10"

[lints.clippy]
pedantic = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
